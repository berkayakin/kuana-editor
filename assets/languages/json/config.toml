name = "JSON"
grammar = "json"
# JSONC too (tsconfig, VS Code settings): the grammar accepts comments.
path_suffixes = ["json", "jsonc", ".babelrc", ".eslintrc", ".swcrc"]
line_comments = ["// "]
block_comment = { start = "/*", end = "*/" }
tab_size = 2
# Pairs typing closes (Zed's format), not inside strings and comments.
brackets = [
    { start = "(", end = ")", not_in = ["string", "comment"] },
    { start = "[", end = "]", not_in = ["string", "comment"] },
    { start = "{", end = "}", not_in = ["string", "comment"] },
    { start = "\"", end = "\"", not_in = ["string", "comment"] },
]
