[package]
name = "kuana-text-tools"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "A sample Kuana extension for interface 0.2: transforms the selection and counts words"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
wit-bindgen = "0.63"

[profile.release]
opt-level = "s"
lto = true
strip = true
