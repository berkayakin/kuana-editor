# Responds when the repository owner mentions @claude in an issue, a pull request or a review
# comment, e.g. "@claude review the last 3 commits" or "@claude fix this". Mentions from anyone
# else are ignored before the job starts, so they can't spend API credits.
#
# Setup: the repository secret ANTHROPIC_API_KEY (the same one the daily review uses).

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

permissions: {}

jobs:
  claude:
    if: >-
      github.actor == github.repository_owner && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # required by claude-code-action
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Only the owner's comments are passed to Claude as context, so text a stranger
          # writes in the same thread can't steer it.
          include_comments_by_actor: ${{ github.repository_owner }}
          settings: '{"effortLevel": "high"}'
          claude_args: |
            --model claude-opus-5-5
            --max-turns 80
            --append-system-prompt "Read CLAUDE.md before changing code. Never mention AI, Claude or Anthropic, and never add attribution or Co-Authored-By lines, in commits, pull requests, issues or comments."
