# Builds Kuana for macOS, Windows and Linux when a version tag is pushed
# (`git tag v0.2.0 && git push origin v0.2.0`) and publishes a GitHub Release.
#
# The release stays a draft while the builds upload. Then `publish` writes
# `latest.json` (version, archive names and SHA-256s), signs it with minisign
# (repository secret MINISIGN_SECRET_KEY) and publishes the release. Kuana's
# updater (src/updater.rs) only installs what that signature vouches for.
# A platform whose build fails is left out of the release; the rest ship.
#
# Builds use Cargo.toml's `dist` profile (thin LTO, one codegen unit; slower
# to build than --release), so binaries are in target/[<triple>/]dist.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Turns on the updater; builds from source don't update themselves.
  KUANA_RELEASE: "1"
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ github.ref_name }}

jobs:
  create:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # git-cliff needs the history and tags since the previous release.
          fetch-depth: 0
      - id: version
        name: Check the tag against Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match the version in Cargo.toml ($version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Release notes from the commits and pull requests since the previous tag,
      # each change once, with contributors @mentioned (see cliff.toml).
      - id: notes
        name: Write the release notes
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.14.2
          args: --latest --strip header
        env:
          OUTPUT: release-notes.md
      - name: Create a draft release
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --draft --verify-tag --notes-file "${{ steps.notes.outputs.changelog }}" --title "Kuana ${TAG#v}" $prerelease

  macos:
    needs: create
    runs-on: macos-14
    env:
      VERSION: ${{ needs.create.outputs.version }}
      APP: target/aarch64-apple-darwin/dist/bundle/osx/Kuana.app
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: cargo install cargo-bundle --locked
      - name: Build both architectures
        run: |
          cargo bundle --profile dist --target aarch64-apple-darwin
          cargo build --profile dist --locked --target x86_64-apple-darwin
      - name: Make a universal Kuana.app
        run: |
          lipo -create -output "$APP/Contents/MacOS/kuana" \
            target/aarch64-apple-darwin/dist/kuana target/x86_64-apple-darwin/dist/kuana

      # Developer ID signing and notarization turn on once their repository
      # secrets exist (README: "Signing the macOS app"). Secrets are only given
      # to the steps below, never to the build, which runs dependencies' code.
      - id: signing
        name: Check for signing secrets
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
            [ -n "$APPLE_API_KEY" ] && echo "notarize=true" >> "$GITHUB_OUTPUT"
          fi
          true
      - name: Sign ad hoc
        if: steps.signing.outputs.sign != 'true'
        # Apple Silicon refuses unsigned code. Without a Developer ID, the first
        # launch of a downloaded copy needs Open Anyway (Privacy & Security);
        # updates, fetched by Kuana itself, don't.
        run: codesign --force --deep --sign - "$APP"
      - name: Sign with the Developer ID
        if: steps.signing.outputs.sign == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          # A throwaway keychain holds the certificate for this job only.
          keychain="$RUNNER_TEMP/kuana-signing.keychain-db"
          password=$(openssl rand -hex 24)
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/kuana.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/kuana.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/kuana.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -n 1)
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERTIFICATE doesn't contain a Developer ID Application certificate with its private key"
            exit 1
          fi
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          # Notarization requires the hardened runtime and a secure timestamp.
          codesign --force --options runtime --timestamp --sign "$identity" "$APP"
          codesign --verify --strict --verbose=2 "$APP"
      - name: Notarize Kuana.app
        if: steps.signing.outputs.notarize == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/Kuana.zip"
          scripts/notarize.sh "$RUNNER_TEMP/Kuana.zip"
          # Attach the ticket so Gatekeeper can check it offline.
          xcrun stapler staple "$APP"

      - name: Package
        run: |
          mkdir -p dist dmg
          ditto -c -k --keepParent "$APP" "dist/Kuana-$VERSION-macos.zip"
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          # hdiutil sometimes fails with "Resource busy" on GitHub's runners; retry.
          for attempt in 1 2 3 4 5; do
            hdiutil create -volname Kuana -srcfolder dmg -format UDZO -ov "dist/Kuana-$VERSION-macos.dmg" && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 10))
          done
      - name: Sign the disk image
        if: steps.signing.outputs.sign == 'true'
        run: codesign --timestamp --sign "$SIGNING_IDENTITY" "dist/Kuana-$VERSION-macos.dmg"
      - name: Notarize the disk image
        if: steps.signing.outputs.notarize == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          scripts/notarize.sh "dist/Kuana-$VERSION-macos.dmg"
          xcrun stapler staple "dist/Kuana-$VERSION-macos.dmg"
      - run: gh release upload "$TAG" dist/* --clobber

  windows:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            installer: x64compatible
          # GitHub's Arm runner, so the smoke test can start the build too.
          - arch: aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            installer: arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.create.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          targets: ${{ matrix.target }}
      # The target is named, so the build is for this architecture even if the
      # toolchain itself runs emulated.
      - run: cargo build --profile dist --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist pkg
          cp "target/${{ matrix.target }}/dist/kuana.exe" LICENSE-MIT LICENSE-APACHE pkg/
          (cd pkg && 7z a -tzip "../dist/kuana-$VERSION-windows-${{ matrix.arch }}.zip" .)
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) {
            # No Chocolatey on this image: the installer from Inno Setup's site.
            Invoke-WebRequest https://jrsoftware.org/download.php/is.exe -OutFile "$env:RUNNER_TEMP\is.exe"
            Start-Process "$env:RUNNER_TEMP\is.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          }
          & $iscc "/DVersion=$env:VERSION" "/DArch=${{ matrix.arch }}" "/DArchitectures=${{ matrix.installer }}" `
            "/DSource=..\target\${{ matrix.target }}\dist" scripts\kuana.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: gh release upload "$TAG" dist/* --clobber

  linux:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported runners, so the binary runs on older glibc versions too.
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.create.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install GPUI's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev \
            libvulkan-dev libasound2-dev libssl-dev libzstd-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
      - run: cargo build --profile dist --locked
      - name: Package
        run: |
          mkdir -p dist pkg
          cp target/dist/kuana LICENSE-MIT LICENSE-APACHE pkg/
          tar -czf "dist/kuana-$VERSION-linux-${{ matrix.arch }}.tar.gz" -C pkg .
      - run: gh release upload "$TAG" dist/* --clobber

  publish:
    needs: [create, macos, windows, linux]
    if: ${{ !cancelled() && needs.create.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.create.outputs.version }}
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
    steps:
      - name: Download the uploaded archives
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist
      - name: Write latest.json and SHA256SUMS
        working-directory: dist
        run: |
          python3 - <<'EOF'
          import hashlib, json, os, sys
          version = os.environ["VERSION"]
          # Platform keys match `platform()` in src/updater.rs.
          names = {
              "macos": f"Kuana-{version}-macos.zip",
              "windows-x86_64": f"kuana-{version}-windows-x86_64.zip",
              "windows-aarch64": f"kuana-{version}-windows-aarch64.zip",
              "linux-x86_64": f"kuana-{version}-linux-x86_64.tar.gz",
              "linux-aarch64": f"kuana-{version}-linux-aarch64.tar.gz",
          }
          def sha256(name):
              with open(name, "rb") as f:
                  return hashlib.sha256(f.read()).hexdigest()
          assets = {key: {"name": name, "sha256": sha256(name)} for key, name in names.items() if os.path.exists(name)}
          if not assets:
              sys.exit("No archives were uploaded; every build failed.")
          with open("latest.json", "w") as f:
              json.dump({"version": version, "assets": assets}, f, indent=2)
          with open("SHA256SUMS", "w") as f:
              for name in sorted(os.listdir(".")):
                  if name not in ("latest.json", "SHA256SUMS"):
                      f.write(f"{sha256(name)}  {name}\n")
          EOF
          cat latest.json
      - name: Sign latest.json
        working-directory: dist
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::Add the MINISIGN_SECRET_KEY repository secret (the contents of ~/.minisign/kin-release.key)"
            exit 1
          fi
          sudo apt-get install -y minisign
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/kuana.key"
          minisign -S -s "$RUNNER_TEMP/kuana.key" -m latest.json -t "Kuana $VERSION"
          rm "$RUNNER_TEMP/kuana.key"
      - name: Publish the release
        run: |
          cd dist
          gh release upload "$TAG" latest.json latest.json.minisig SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

  # Points the Homebrew cask (github.com/berkayakin/homebrew-tap) at this release,
  # from scripts/kuana.rb. Needs the HOMEBREW_TAP_TOKEN secret: a fine-grained
  # token with write access to that repository's contents only. Pre-releases
  # and releases without a macOS build leave the cask as it is.
  homebrew:
    needs: [create, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.create.outputs.version }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Update the cask
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::notice::No HOMEBREW_TAP_TOKEN secret; the Homebrew cask isn't updated"
            exit 0
          fi
          zip="Kuana-$VERSION-macos.zip"
          sha=$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/SHA256SUMS" \
            | awk -v name="$zip" '$2 == name { print $1 }')
          if [ -z "$sha" ]; then
            echo "::warning::$zip isn't in this release; the Homebrew cask stays as it was"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:$HOMEBREW_TAP_TOKEN@github.com/berkayakin/homebrew-tap.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          sed -e "s/^  version \".*\"$/  version \"$VERSION\"/" -e "s/^  sha256 \".*\"$/  sha256 \"$sha\"/" \
            scripts/kuana.rb > "$RUNNER_TEMP/tap/Casks/kuana.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/kuana.rb
          git diff --cached --quiet && exit 0
          git commit -m "kuana $VERSION"
          git push

  # Starts each published build and drives it through its main areas; see smoke.yml.
  smoke:
    needs: publish
    uses: ./.github/workflows/smoke.yml
    with:
      tag: ${{ github.ref_name }}
