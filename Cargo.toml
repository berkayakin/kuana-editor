[workspace]
members = ["crates/kuana-core", "crates/kuana-os", "crates/kuana-server"]
# `cargo build` / `test` / `run`: the app and the library it uses. The remote
# server builds with `-p kuana-server` (or `--workspace`).
default-members = [".", "crates/kuana-core", "crates/kuana-os"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[package]
name = "kuana"
version = "0.3.2"
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata.bundle]
name = "Kuana"
identifier = "dev.kuana.editor"
icon = ["assets/app-icon/macos/Kuana.icns", "assets/app-icon/linux/hicolor/*/apps/dev.kuana.editor.png"]
category = "public.app-category.developer-tools"
short_description = "A small, fast GPU-rendered code editor"
# The bundled fonts' licenses (the fonts themselves are inside the binary).
resources = ["assets/fonts/OFL.txt", "assets/fonts/JetBrainsMono-OFL.txt"]

[package.metadata.bundle.osx]
# Lets Finder offer Kuana in Open With for folders and files (Alternate: never the default app).
info_plist_exts = ["assets/macos/document-types.plist", "assets/macos/privacy.plist"]

[dependencies]
# The GPUI-free part shared with the remote server (`crates/kuana-core`).
kuana-core = { path = "crates/kuana-core" }
kuana-os = { path = "crates/kuana-os" }
alacritty_terminal = { version = "0.26.0", default-features = false }
# alacritty_terminal's own, for wrapping its pty (`terminal::run_log::Teed`).
polling = "3.11"
# Run tabs on Windows hand PowerShell their script encoded (`-EncodedCommand`).
base64 = "0.22"
futures = "0.3.34"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
# Image dimensions for previews (GPUI already depends on it, with its formats).
image = { version = "0.25", default-features = false }
globset = "0.4"
ignore = "0.4.33"
# Extensions' tree-sitter grammars, compiled to libraries and loaded at run time.
libloading = "0.8"
# Checks that an update's manifest was signed by the release workflow.
minisign-verify = "0.3"
nucleo-matcher = "0.3.1"
# The Database view's Oracle connections: Oracle's own pure-Rust driver (no Oracle
# Client libraries; TLS through rustls). Pinned while it's a beta.
oracledb = "=26.0.0-beta.5"
# Its PostgreSQL, MySQL/MariaDB and SQLite connections: the usual pure-Rust
# clients (TLS through rustls, with ring) and SQLite compiled in.
tokio-postgres = "0.7"
tokio = { version = "1", default-features = false, features = ["rt"] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
mysql = { version = "28", default-features = false, features = ["minimal-rust", "rustls-tls-ring"] }
rusqlite = { version = "0.42", default-features = false, features = ["bundled", "column_decltype"] }
# Saved database passwords, in the system's keychain (Keychain, Credential
# Manager; on Linux the kernel keyring, which forgets them on restart).
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native"] }
oxc_allocator = "0.139.0"
oxc_ast = "0.139.0"
oxc_diagnostics = "0.139.0"
oxc_parser = "0.139.0"
oxc_semantic = "0.139.0"
oxc_span = "0.139.0"
oxc_syntax = "0.139.0"
regex = "1.13.1"
# Lines end only at LF, as tree-sitter, Git and folds count them (the default
# `unicode_lines` also ends them at U+2028, NEL, VT, FF and CR; a lone CR is
# read as LF, see `encoding::to_lf`).
ropey = { version = "1.6", default-features = false, features = ["simd"] }
rumdl = { version = "0.2.79", default-features = false }
# JSON schemas of settings.json (and so on) for the JSON language server.
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
similar = "3.2.0"
toml = "0.8"
trash = "5"
tree-sitter = { version = "0.26.13", features = ["wasm"] }
tree-sitter-language = "0.1"
tree-sitter-bash = "0.25.1"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.3"
tree-sitter-php = "0.25.1"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
# The file tree's search matches decomposed names (macOS writes some) as
# composed (rumdl already depends on it).
unicode-normalization = "0.1.25"
# Where a long line's segments start without soft wrap (alacritty_terminal already
# depends on it).
unicode-width = "0.2.2"
url = "2.5.8"
# A remote project's `file://` URLs from Claude Code, read the same on every system
# (`claude_ide::path_of`; url already depends on it).
percent-encoding = "2.3.2"
# Claude Code's `/ide` connection (`claude_ide.rs`): a WebSocket server on plain threads.
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
# Model providers' HTTP APIs (`src/ai/`): blocking, on threads of their own, streamed line by
# line; the system's certificates, so a company's TLS proxy works.
ureq = { version = "3.5", default-features = false, features = ["rustls", "gzip", "platform-verifier"] }
# Agent Client Protocol message types (`src/acp/`), the protocol agents like Claude, Codex and
# Gemini CLI speak over stdio.
agent-client-protocol-schema = { version = "1.7", default-features = false }
# Zed extensions' own code (`extension.wasm`, a WebAssembly component) for their
# language servers: the wasmtime tree-sitter already brings, with components and WASI,
# compiling on several threads (with the rayon Kuana already has).
wasmtime = { version = "36.0.18", default-features = false, features = ["component-model", "cranelift", "parallel-compilation", "runtime", "std"] }
wasmtime-wasi = { version = "36.0.18", default-features = false }
notify = "8"
encoding_rs = "0.8"
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
# TestAppContext for tests of entities and views.
gpui = { version = "0.2.2", features = ["test-support"] }

[target.'cfg(unix)'.dependencies]
# setsid for the login shell that reports PATH, so it can't take over Kuana's terminal.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSDocumentController", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSData", "NSDictionary", "NSError", "NSFileManager", "NSObject", "NSString", "NSURL", "NSUserDefaults", "NSValue"] }

[target.'cfg(target_os = "windows")'.dependencies]
# The window's HWND, whose taskbar button flashes for an agent session's news.
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

# GPUI 0.2.2 needs taffy 0.9.0 exactly; this copy never reuses a cached final
# layout, so an element doesn't keep the shrink-to-fit layout it got while its
# parent was being measured (text fields at their minimum width at some window widths).
[patch.crates-io]
taffy = { path = "vendor/taffy" }
# GPUI 0.2.2 with Zed's later fix for idle GPU use (zed-industries/zed#45369):
# it re-rendered the whole window every display refresh for a second after any
# input, mouse moves included; now only after input that changed something,
# arriving at 60 events a second or more (scrolling, dragging). See
# vendor/gpui/KUANA.md.
gpui = { path = "vendor/gpui" }

# Debug builds: Kuana's own code compiles quickly, dependencies (tree-sitter, oxc, gpui) stay fast.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# What releases are built with (`--profile dist`, see .github/workflows/release.yml), as Zed
# builds its own: slower to build, a smaller binary (thin LTO, one codegen unit), and line tables
# for backtraces. Those (~260 MB) go to a file beside the binary (kuana.dSYM, .dwp, .pdb) that
# isn't shipped; on Linux they'd be in the binary. `cargo build --release` stays as quick as it was.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
debug = "limited"
split-debuginfo = "packed"

[lints]
workspace = true

[workspace.lints.clippy]
# Requests and prompts started for their effect, their answers not needed.
let_underscore_future = "allow"
type_complexity = "allow"
# One-range vectors are meant (folds, ranges to select).
single_range_in_vec_init = "allow"
# `from_utf16` converts an IME offset, taking the document from `self`.
wrong_self_convention = "allow"
needless_range_loop = "allow"
# GPUI entities are single-threaded; their `Arc`s are shared within the app.
arc_with_non_send_sync = "allow"
