[package]
name = "kuana"
version = "0.1.21"
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata.bundle]
name = "Kuana"
identifier = "dev.kuana.editor"
icon = ["assets/app-icon/macos/Kuana.icns", "assets/app-icon/linux/hicolor/*/apps/dev.kuana.editor.png"]
category = "public.app-category.developer-tools"
short_description = "A small, fast GPU-rendered code editor"

[package.metadata.bundle.osx]
# Lets Finder offer Kuana in Open With for folders and files (Alternate: never the default app).
info_plist_exts = ["assets/macos/document-types.plist"]

[dependencies]
alacritty_terminal = { version = "0.26.0", default-features = false }
# Run tabs on Windows hand PowerShell their script encoded (`-EncodedCommand`).
base64 = "0.22"
futures = "0.3.34"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
# Image dimensions for previews (GPUI already depends on it, with its formats).
image = { version = "0.25", default-features = false }
globset = "0.4"
ignore = "0.4.33"
# Extensions' tree-sitter grammars, compiled to libraries and loaded at run time.
libloading = "0.8"
# Checks that an update's manifest was signed by the release workflow.
minisign-verify = "0.3"
nucleo-matcher = "0.3.1"
oxc_allocator = "0.139.0"
oxc_ast = "0.139.0"
oxc_diagnostics = "0.139.0"
oxc_parser = "0.139.0"
oxc_semantic = "0.139.0"
oxc_span = "0.139.0"
oxc_syntax = "0.139.0"
regex = "1.13.1"
# Lines end only at LF, as tree-sitter, Git and folds count them (the default
# `unicode_lines` also ends them at U+2028, NEL, VT, FF and CR; a lone CR is
# read as LF, see `encoding::to_lf`).
ropey = { version = "1.6", default-features = false, features = ["simd"] }
rumdl = { version = "0.2.79", default-features = false }
# JSON schemas of settings.json (and so on) for the JSON language server.
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
similar = "3.2.0"
toml = "0.8"
trash = "5"
tree-sitter = { version = "0.26.13", features = ["wasm"] }
tree-sitter-language = "0.1"
tree-sitter-bash = "0.25.1"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.3"
tree-sitter-php = "0.25.1"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
# The file tree's search matches decomposed names (macOS writes some) as
# composed (rumdl already depends on it).
unicode-normalization = "0.1.25"
url = "2.5.8"
# Zed extensions' own code (`extension.wasm`, a WebAssembly component) for their
# language servers: the wasmtime tree-sitter already brings, with components and WASI,
# compiling on several threads (with the rayon Kuana already has).
wasmtime = { version = "36.0.18", default-features = false, features = ["component-model", "cranelift", "parallel-compilation", "runtime", "std"] }
wasmtime-wasi = { version = "36.0.18", default-features = false }
notify = "8"
encoding_rs = "0.8"
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
# TestAppContext for tests of entities and views.
gpui = { version = "0.2.2", features = ["test-support"] }

[target.'cfg(unix)'.dependencies]
# setsid for the login shell that reports PATH, so it can't take over Kuana's terminal.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSDocumentController", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSData", "NSDictionary", "NSError", "NSFileManager", "NSObject", "NSString", "NSURL"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

# Debug builds: Kuana's own code compiles quickly, dependencies (tree-sitter, oxc, gpui) stay fast.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# What releases are built with (`--profile dist`, see .github/workflows/release.yml), as Zed
# builds its own: slower to build, a smaller binary (thin LTO, one codegen unit), and line tables
# for backtraces. Those (~260 MB) go to a file beside the binary (kuana.dSYM, .dwp, .pdb) that
# isn't shipped; on Linux they'd be in the binary. `cargo build --release` stays as quick as it was.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
debug = "limited"
split-debuginfo = "packed"

[lints.clippy]
# Requests and prompts started for their effect, their answers not needed.
let_underscore_future = "allow"
type_complexity = "allow"
# One-range vectors are meant (folds, ranges to select).
single_range_in_vec_init = "allow"
# `from_utf16` converts an IME offset, taking the document from `self`.
wrong_self_convention = "allow"
needless_range_loop = "allow"
# GPUI entities are single-threaded; their `Arc`s are shared within the app.
arc_with_non_send_sync = "allow"
