[package]
name = "kuana-os"
version = "0.3.2"
edition.workspace = true
license.workspace = true
description = "What Kuana asks of the operating system: keeping the computer awake, notifications, dictation"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSBundle", "NSDictionary", "NSError", "NSObject", "NSString", "NSThread"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "bitflags", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }

[lints]
workspace = true
