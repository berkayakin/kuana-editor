[package]
name = "kuana-core"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "Kuana's GPUI-free core, shared by the editor and its remote server"

[dependencies]
base64 = "0.22"
serde_json = "1"
encoding_rs = "0.8"
futures = "0.3.34"
ignore = "0.4.33"
notify = "8"
regex = "1.13.1"
# Search works on documents' text as the editor keeps it (LF lines only, as in the app).
ropey = { version = "1.6", default-features = false, features = ["simd"] }

[lints]
workspace = true
